services:
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"

  checker:
    build:
      context: .
      dockerfile: app/checker/Dockerfile
    ports:
      - "9000:8080"
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-central-1
    depends_on:
      - dynamodb-local